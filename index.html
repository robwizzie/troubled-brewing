<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#f7f1e4" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Per-page SEO. The build (scripts/seo-build-plugin.mjs) replaces everything
      between these markers with each route's own title, description, canonical,
      Open Graph/Twitter tags and JSON-LD, writing dist/<route>.html per page.
      At runtime <SEO/> upserts the same tags (CMS `pages` values win when set).
      Source of truth: src/lib/seo.js + src/lib/jsonld.js. Keep the markers.
    -->
    <!--seo:start-->
    <title>Trouble Brewing Coffee House | Haddon Heights NJ Coffee Shop</title>
    <!--seo:end-->

    <!--
      SPA routing fix for GitHub Pages (spa-github-pages technique).
      404.html redirects deep links to index.html with the path encoded in the query
      string; this snippet decodes it back before React Router boots. See docs/DEPLOYMENT.md.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Fonts: characterful display serif + clean sans (swappable in tokens.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
