<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Trouble Brewing Coffee House</title>
    <!--
      SPA fallback for GitHub Pages (spa-github-pages technique).
      Pages has no server rewrites, so a hard refresh on /menu would 404. This
      page encodes the path into a query string and redirects to index.html,
      where a snippet decodes it back before React Router boots.
      See docs/DEPLOYMENT.md.
    -->
    <script type="text/javascript">
      (function () {
        // Number of leading path segments to preserve before the SPA route:
        // 1 while served as the project page under /troubled-brewing/, 0 on the
        // shop's own domain. Worked out from the URL, so the same file is right
        // for both and the domain switch needs no edit here.
        var l = window.location;
        var segmentCount = /^\/troubled-brewing(\/|$)/.test(l.pathname) ? 1 : 0;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + segmentCount)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(segmentCount)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
